name: Validate repository changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile embedded workflow Python blocks
        run: |
          python - <<'PY'
          import re, textwrap
          from pathlib import Path
          for path in Path('scripts').glob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              for match in re.finditer(r"python3 - <<'PYEOF'\n(.*?)\n\s*PYEOF", text, re.S):
                  compile(textwrap.dedent(match.group(1)), str(path), 'exec')
          print('script and inline Python compile')
          PY
