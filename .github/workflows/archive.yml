# Workflow 1：归档 — goodurl 有新 JSON 上报时运行
#
# 功能：遍历 goodurl 分支的 *.json，下载专辑图/歌曲文件/歌词，
# 把专辑图嵌入歌曲文件（同时保留独立的专辑图文件），
# 保存到 main 分支的【歌名-歌手】文件夹，然后把 main commit 回去。
#
# 容错约定：
#   - 歌曲文件下载失败 / 过小 / 时长过短 → [FAIL]，整首丢弃，JSON 留在 goodurl 下轮重试。
#   - 封面或歌词链接损坏 → 软失败，歌曲照常归档，缺什么写进 info.json
#     （picOk / lrcOk / coverError / lyricError）。
#   - info.json 是本 workflow 唯一的"缺失状态"来源；missing.txt 由 cleanup workflow
#     每天扫描 info.json 生成并尝试补抓，本 workflow 不写 missing.txt（避免两边抢同一个文件）。

name: Archive goodurl to main

on:
  push:
    branches: [goodurl]
    paths:
      - '**.json'
  workflow_dispatch:

concurrency:
  group: archive-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    # cleanup workflow 的提交带 [skip archive]，避免删 JSON 时又空跑一遍
    if: "!contains(github.event.head_commit.message, '[skip archive]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout goodurl（待归档 JSON）
        uses: actions/checkout@v4
        with:
          ref: goodurl
          path: goodurl
          fetch-depth: 1

      - name: Checkout main（音乐库）
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /aliases.json
            /scripts/


      - name: Expand sparse checkout for queued songs and alias targets
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          from pathlib import Path
          names = set()
          for p in Path("goodurl").glob("*.json"):
              stem = p.stem
              if stem and stem not in (".", "..") and "/" not in stem and "\\" not in stem:
                  names.add(stem)
          try:
              data = json.loads(Path("main/aliases.json").read_text(encoding="utf-8"))
              aliases = data.get("aliases", {}) if data.get("version") == 1 else {}
              for name in tuple(names):
                  target = aliases.get(name) if isinstance(aliases, dict) else None
                  if isinstance(target, str) and target not in (".", "..") and target and "/" not in target and "\\" not in target:
                      names.add(target)
          except Exception:
              pass
          if names:
              subprocess.run(["git", "-C", "main", "sparse-checkout", "add", "--skip-checks", *[n + "/" for n in sorted(names)]], check=True)
          print(f"sparse folders expanded: {len(names)}")
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet mutagen requests pillow

      - name: Archive pending songs
        env:
          GOODURL_DIR: goodurl
          MAIN_DIR: main
          JSON_DIR: '' # 必须与 Worker 的 JSON_DIR 一致，默认根目录
          RETRY_TOTAL: '3'       # 网络层自动重试次数（429/5xx/连接错误）
          MIN_COVER_BYTES: '1024'
        run: |
          python3 main/scripts/archive.py

      - name: Commit and push to main
        run: |
          cd main
          git config user.name "lingyicute"
          git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          NEW_DIRS=$(git -c core.quotePath=false diff --cached --name-only | cut -d/ -f1 | sort -u)
          COUNT=$(printf '%s\n' "$NEW_DIRS" | grep -c .)
          git commit -m "archive: 归档 ${COUNT} 首歌曲" -m "$NEW_DIRS"
          git push origin HEAD:main || (echo "push 冲突，rebase 重试..." && git pull --rebase origin main && git push origin HEAD:main)
