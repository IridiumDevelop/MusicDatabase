# Workflow 2：清理 + 已收集目录 + 补抓缺失资源 — 每天 UTC+8 03:50 运行
#
# 功能：
#   1) 遍历 main 分支，删除 goodurl 分支中已处理（已归档）的 JSON；
#      判定标准：main 分支存在同名【歌名-歌手】文件夹，且其中含有 song.* 音频文件。
#   2) 生成已收集目录：格式【歌名-歌手】，每行一个，纯文本，写到 main 分支的 list.txt。
#      收集器 Worker 收到新报告时会先查 list.txt，已收集过的直接跳过，避免无效循环。
#   3) refetch job：扫描 main 各文件夹的 info.json，把「缺封面 / 缺歌词」的条目汇总成
#      main/missing.txt，并用 info.json 里保留的原始 pic / lrc 链接重新下载补齐。
#      archive workflow 只做软失败记录，重试责任全在这里。
#
# 两个 job 顺序执行（refetch needs cleanup），避免同一轮里两边同时往 main 提交。

name: Cleanup processed goodurl

on:
  schedule:
    - cron: '50 19 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-goodurl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout goodurl
        uses: actions/checkout@v4
        with:
          ref: goodurl
          fetch-depth: 1

      - name: Checkout main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests pillow

      - name: Delete archived JSONs + rebuild list.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          JSON_DIR: '' # 必须与 Worker / archive 的 JSON_DIR 一致，默认根目录
        run: |
          python3 main/scripts/cleanup.py

      - name: Commit and push to goodurl
        run: |
          git config user.name "lingyicute" && git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "cleanup: 删除已归档的 JSON [skip archive]"
          git push origin HEAD:goodurl || (echo "push 冲突，rebase 重试..." && git pull --rebase origin goodurl && git push origin HEAD:goodurl)

  refetch:
    # 补抓 archive 阶段因链接损坏而缺失的封面 / 歌词，并维护 main/missing.txt
    # 放在 cleanup 之后串行执行：避免同一轮里两个 job 同时往 main 提交
    # !cancelled()：即使 cleanup 因为 API 限流之类的原因失败，补抓照跑
    needs: cleanup
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main（音乐库）
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet mutagen requests pillow

      - name: Refetch missing covers and lyrics
        env:
          MAIN_DIR: main
          MAX_ATTEMPTS: '5'      # 同一条目最多补抓次数，超过后只在 missing.txt 留档不再重试
          PER_RUN_LIMIT: '40'    # 单次运行最多尝试多少条，避免 job 超时
          RETRY_TOTAL: '3'
          MIN_COVER_BYTES: '1024'
        run: |
          python3 main/scripts/refetch.py

      - name: Commit and push to main
        run: |
          cd main
          git config user.name "lingyicute"
          git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TOUCHED=$(git -c core.quotePath=false diff --cached --name-only | cut -d/ -f1 | sort -u)
          git commit -m "refetch: 补抓缺失的封面/歌词 [skip archive]" -m "$TOUCHED"
          git push origin HEAD:main || (echo "push 冲突，rebase 重试..." && git pull --rebase origin main && git push origin HEAD:main)
